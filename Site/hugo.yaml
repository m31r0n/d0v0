  hero:
    enable: true
    intro: "Hola, soy"
    title: "David Ramos"
    subtitle: "Especialista en Inteligencia de Amenazas · DFIR"
    content: "Especialista en ciberseguridad con más de 5 años de experiencia. Actualmente enfocado en Respuesta a Incidentes y Análisis Forense Digital (DFIR), investigando y conteniendo ransomware, intrusiones avanzadas y fraude con enfoque en Threat Intelligence, OSINT y análisis de TTPs."
    badges: ["DFIR", "Threat Intelligence", "OSINT", "Adversary Simulation"]
    image: /images/hero.png
    bottomImage:
      enable: true
    button:
      enable: true
      name: "Ver CV / Resume"
      url: "https://www.linkedin.com/in/david-ramos-rodriguez/"
      download: false
      newPage: true
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/m31r0n
        - icon: fab fa-linkedin
          url: https://www.linkedin.com/in/david-ramos-rodriguez/
        - icon: fab fa-x-twitter
          url: https://x.com/david_ramos_rod

  about:
    enable: true
    title: "Perfil profesional"
    image: "/images/me.png"
    content: |-
      Consultor en inteligencia de amenazas y protección de activos críticos. He liderado iniciativas de **Threat Intelligence**, desarrollo de políticas de seguridad y ejercicios de emulación de adversarios para fortalecer la postura de seguridad corporativa.

      Soy parte de la directiva de **CiberSecUNI**, **Hack The Box Ambassador** y cofundador de **Black Alpaca Security Conference**. Speaker en eventos de LATAM (Perú, Argentina, Costa Rica, Nicaragua) y representante de Perú en competencias internacionales.
    skills:
      enable: true
      title: "Áreas de especialización"
      items:
        - "Ethical Hacking"
        - "DFIR & Incident Response"
        - "Threat Intelligence & OSINT"
        - "Adversary Simulation"
        - "Threat Hunting"
        - "Investigación de TTPs"

  experience:
    enable: true
    title: "Experiencia"
    items:
      - job: "Digital Forensic and Incident Response Specialist – Coordinador LATAM"
        company: "Lazarus Technology"
        companyUrl: "https://www.linkedin.com/company/lazarus-technology/"
        date: "May 2024 - Actualidad"
        content: |-
          - Lidero el equipo de respuesta ante incidentes para LATAM.
          - Gestiono incidentes críticos de alta complejidad con foco en contención y erradicación.
          - Investigo actores de amenaza con OSINT y CTI en Surface/Dark Web.
          - Elaboro reportes forenses de ransomware, intrusiones y fraude.
      - job: "Analista Jr. de Ciberseguridad"
        company: "Centria - CSC BRECA Corp."
        companyUrl: "https://www.centria.net/"
        date: "Oct 2022 - Abr 2024"
        content: |-
          - Gestioné servicios de Ethical Hacking y Vulnerability Management para unidades del corporativo.
          - Responsable de Threat Intelligence corporativo (BRECA): monitoreo Dark/Deep Web e informes ejecutivos.
          - Administré el servicio de Breach & Attack Simulator alineado a campañas reales.
          - Desarrollé políticas y procedimientos bajo NIST e ISO 27001.
      - job: "Practicante de Ciberseguridad"
        company: "Centria - CSC BRECA Corp."
        companyUrl: "https://www.centria.net/"
        date: "Jun 2021 - Oct 2022"
        content: |-
          - Soporte a controles de seguridad (Firewall, DLP, MDM, MFA, WAF, SIEM).
          - Participación en comités de cambio y proyectos de mitigación de riesgo.
          - Evaluación e implementación de tecnologías de ciberseguridad.

