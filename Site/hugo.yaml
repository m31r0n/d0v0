          link: https://github.com/m31r0n/SnipRecover-CLI
        badges: ["Python", "Incident Response", "CLI"]
        links:
          - icon: fab fa-github
            url: https://github.com/m31r0n/SnipRecover-CLI
      - title: meta-scan
