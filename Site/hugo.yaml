            url: https://github.com/m31r0n/BMP-CTF-Repair-Tool
      - title: USB2TEXT-CTF
        content: Decodificación de keystrokes USB-HID desde pcap/pcapng para análisis forense.
        image: /images/projects/usb2text.svg
        featured:
          name: Repositorio
          link: https://github.com/m31r0n/USB2TEXT-CTF
        badges: ["Python", "PCAP", "Forensics"]
        links:
