params:
  title: "D0V0"
  description: Portafolio profesional de ciberseguridad, threat hunting y writeups técnicos.
  # staticPath: ""  # The path to serve the static files from
  favicon: "/fav.png"

  # Whether to serve bootstrap css and js files from CDN or not. Can be set to true, "css" or "js" to choose between
  # serving both, only the css, or only the js files through the CDN. Any other value will make so that CDN is not used.
  # Note the lack of "" in true, it should be of boolean type.
  useBootstrapCDN: false

  # If you want to load dynamically responsive images from Cloudinary
  # This requires your images to be uploaded + hosted on Cloudinary
  # Uncomment and change YOUR_CLOUD_NAME to the Cloud Name in your Cloudinary console
  # cloudinary_cloud_name: "YOUR_CLOUD_NAME"

  # Whether to add mathjax support on all pages. Alternatively, you can opt-in per page by adding `mathjax: true` in the frontmatter.
  mathjax: false

  # Whether the fade animations on the home page will be enabled
  animate: true

  theme:
    # disableThemeToggle: true
    # defaultTheme: "light" # dark

  font:
    fontSize: 1rem # default: 1rem
    fontWeight: 400 # default: 400
    lineHeight: 1.5 # default: 1.5
    textAlign: left # default: left

  color:
    textColor: "#101828"
    secondaryTextColor: "#475467"
    textLinkColor: "#0f62fe"
    backgroundColor: "#f8fafc"
    secondaryBackgroundColor: "#eef2ff"
    primaryColor: "#2563eb"
    secondaryColor: "#ffffff"

    darkmode:
      textColor: "#e2e8f0"
      secondaryTextColor: "#94a3b8"
      textLinkColor: "#93c5fd"
      backgroundColor: "#020617"
      secondaryBackgroundColor: "#111827"
      primaryColor: "#60a5fa"
      secondaryColor: "#0f172a"

  # If you want to customize the menu, you can change it here
  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    # brandLogo: "/logo.png" # Logo for the brand | default is the favicon variable
    # showBrandLogo: false # Show brand logo in nav bar | default is true
    brandName: "David Ramos" # Brand name for the brand | default is the title variable
    disableSearch: false
    searchPlaceholder: "Buscar contenido..."
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "Hola, soy"
    title: "David Ramos."
    subtitle: "Threat Hunter, DFIR y competidor CTF"
    content: "Transformo señales en inteligencia accionable. Publico investigación aplicada, writeups técnicos y metodologías reales para fortalecer capacidades defensivas en Blue Team y respuesta a incidentes."
    image: /images/hero.png
    bottomImage:
      enable: true
    # roundImage: true # Make hero image circular | default false
    button:
      enable: true
      name: "Descargar CV"
      url: "#"
      download: true
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/m31r0n
        - icon: fab fa-x-twitter
          url: https://x.com/david_ramos_rod
      customIcons:
        - icon: /fav.png
          url: "https://d0v0.netlify.app/"

  # About
  about:
    enable: true
    title: "Sobre mí"
    image: "/images/me.png"
    content: |-
      Especialista en ciberseguridad con enfoque en **Threat Intelligence**, **Incident Response** y **Digital Forensics**. Actualmente lidero la célula LATAM de respuesta a incidentes en Lazarus Technology, investigando campañas activas en Surface/Dark Web y elaborando reportes forenses sobre ransomware, fraude de identidad y compromisos avanzados.

      Compito de forma activa en CTFs internacionales y comparto conocimiento mediante charlas técnicas, writeups y laboratorios. Mi objetivo: convertir aprendizaje continuo en capacidades defensivas medibles.
    skills:
      enable: true
      title: "Áreas de especialización:"
      items:
        - "Threat Intelligence y OSINT"
        - "Respuesta a Incidentes y Forense Digital"
        - "Ethical Hacking y Pentesting"
        - "Gestión de Vulnerabilidades"
        - "Automatización con Python y Bash"
        - "Hardening en Linux y Windows"


  # Experience
  experience:
    enable: true
    
    items:
      - job: "Forensic Analyst & Incident Handler"
        company: "Lazarus Technology"
        companyUrl: "https://www.linkedin.com/company/lazarus-technology/"
        date: "May 2024 - Present"
        content: "Lead the LATAM incident response team, managing high-complexity security incidents. Conduct OSINT investigations on the Surface Web and Dark Web, and produce detailed forensic reports on ransomware attacks, hacks, identity fraud, and other incidents."

      - job: "Junior Cybersecurity Analyst"
        company: "Centria CSC BRECA Corp."
        companyUrl: "https://www.centria.net/"
        date: "Oct 2022 - Apr 2024"
        content: "Performed ethical hacking and vulnerability management across corporate business units. Owned the Threat Intelligence service—administration, Dark/Deep Web monitoring, and intelligence reporting—and managed the Breach & Attack Simulator platform to align simulations with real-world campaigns, improving endpoint, web, WAF, email protection, and lateral movement metrics. Wrote cybersecurity policies and procedures under NIST and ISO27001."

      - job: "Cybersecurity Intern"
        company: "Centria - CSC BRECA Corp."
        companyUrl: "https://www.centria.net/"
        date: "Jun 2021 - Oct 2022"
        content: "Supported low-complexity security requirements (firewall, DLP, MDM, MFA, WAF, SIEM). Participated in change committees and security projects, evaluated and implemented security technologies, drafted monthly reports and KPI presentations, and automated recurring tasks to boost operational efficiency."

